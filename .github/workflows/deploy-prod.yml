name: Deploy Backend to Production

on:
  # push:
  #   branches:
  #     - master

  workflow_dispatch:
    inputs:
      mode:
        description: "Modes de déploiement"
        required: true
        type: choice
        options:
          - compose
          - pm2
      operation:
        description: "Vérification seule ou déploiement"
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - preflight

jobs:
  deploy-compose:
    if: ${{ github.event_name == 'push' || inputs.mode == 'compose' }}
    runs-on: smarteat-runner-backend

    steps:
      - name: Deploy on server with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.1.140
          username: smarteatprod
          password: root
          port: 22
          script_stop: false
          script: |
            set -e

            APP_DIR=/home/smarteatprod/smarteat/backend
            BRANCH=master
            REPO_URL=https://github.com/SuperJumper404/express-pos.git
            COMPOSE_FILE=compose.yml

            OPERATION='${{ inputs.operation || 'deploy' }}'
            if [ "$OPERATION" = preflight ]; then
              echo 'Production Docker inventory'
              docker ps --format '{{.Names}} | {{.Image}} | {{.Status}} | {{.Ports}}'
              for project in backend frontend; do
                project_dir=/home/smarteatprod/smarteat/$project
                if [ -d "$project_dir/.git" ]; then
                  echo "$project commit: $(git -C "$project_dir" rev-parse HEAD)"
                  git -C "$project_dir" status --short
                fi
              done
              df -h /home/smarteatprod/smarteat
              for source_file in /home/smarteatprod/smarteat/backend/src/routers/r_users.js /home/smarteatprod/smarteat/backend/src/helpers/platformSupport.js /home/smarteatprod/smarteat/frontend/static/backoffice-access.html; do
                if [ -f "$source_file" ]; then sha256sum "$source_file"; fi
              done
              for wallet in /home/smarteatprod/.smarteat/apple-wallet/production/compose-wallet.sh /home/smarteatprod/.smarteat/apple-wallet/prod/compose-wallet.sh; do
                if [ -x "$wallet" ]; then echo "Wallet Compose wrapper: $wallet"; fi
              done
              if docker ps --format '{{.Names}}' | grep -qx express_pos_app_production; then
                docker exec express_pos_app_production node -e 'const mysql=require("mysql2/promise");(async()=>{const c=await mysql.createConnection(process.env.DATABASE_URL);const [v]=await c.query("SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 4");const [t]=await c.query("SELECT table_name FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (?,?,?)",["customers","loyalty_members","customer_directory_contacts"]);console.log(JSON.stringify({schemaVersions:v.map(r=>r.version),featureTables:t.map(r=>r.table_name||r.TABLE_NAME)}));await c.end()})().catch(e=>{console.error("Production database preflight:",e.code||"unavailable");process.exitCode=1})'
                docker inspect express_pos_app_production --format '{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}}{{println}}{{end}}'
              else
                echo 'Production app container not present under the expected name.'
              fi
              exit 0
            fi

            umask 077
            BACKUP_DIR=/home/smarteatprod/smarteat-backups/backend-$(date -u +%Y%m%d-%H%M%S)-$$
            mkdir -p "$BACKUP_DIR"
            test "$APP_DIR" = /home/smarteatprod/smarteat/backend
            if [ -d "$APP_DIR" ]; then
              git -C "$APP_DIR" rev-parse HEAD > "$BACKUP_DIR/previous.sha"
              if [ -f "$APP_DIR/.env.production" ]; then cp "$APP_DIR/.env.production" "$BACKUP_DIR/runtime.env.production"; fi
              tar -czf "$BACKUP_DIR/source.tar.gz" --exclude=node_modules --exclude=.git -C "$APP_DIR" .
            fi
            docker inspect express_pos_db_production >/dev/null
            DATABASE_NAME=$(docker exec express_pos_app_production node -p 'new URL(process.env.DATABASE_URL).pathname.slice(1)')
            test -n "$DATABASE_NAME"
            docker exec express_pos_app_production node -e 'const u=new URL(process.env.DATABASE_URL);const q=value=>JSON.stringify(decodeURIComponent(value));process.stdout.write("[client]\nuser="+q(u.username)+"\npassword="+q(u.password)+"\nhost="+JSON.stringify(u.hostname)+"\nport="+(u.port||3306)+"\n")' > "$BACKUP_DIR/database-client.cnf"
            test -s "$BACKUP_DIR/database-client.cnf"
            docker run --rm --network container:express_pos_app_production -v "$BACKUP_DIR/database-client.cnf:/run/database-client.cnf:ro" mysql:8.0.33 mysqldump --defaults-extra-file=/run/database-client.cnf --single-transaction --routines --triggers --databases "$DATABASE_NAME" > "$BACKUP_DIR/database.sql"
            rm -f "$BACKUP_DIR/database-client.cnf"
            test -s "$BACKUP_DIR/database.sql"
            gzip "$BACKUP_DIR/database.sql"
            echo "PRODUCTION_BACKUP_PATH=$BACKUP_DIR"

            rm -rf "$APP_DIR"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"

            cd "$APP_DIR"

            export DOTENV_PRIVATE_KEY='${{ secrets.DOTENV_PRIVATE_KEY }}'
            test -n "$DOTENV_PRIVATE_KEY"
            docker run --rm \
              -v "$PWD:/app" \
              -w /app \
              -e DOTENV_PRIVATE_KEY \
              node:20-alpine \
              npx --yes @dotenvx/dotenvx decrypt -f .env.production
            ! grep -q "encrypted:" .env.production
            if [ -s "$BACKUP_DIR/runtime.env.production" ]; then
              cp "$BACKUP_DIR/runtime.env.production" .env.production
              ! grep -q "encrypted:" .env.production
            fi

            WALLET_COMPOSE=/home/smarteatprod/.smarteat/apple-wallet/production/compose-wallet.sh
            if [ ! -x "$WALLET_COMPOSE" ] && [ -x /home/smarteatprod/.smarteat/apple-wallet/prod/compose-wallet.sh ]; then
              WALLET_COMPOSE=/home/smarteatprod/.smarteat/apple-wallet/prod/compose-wallet.sh
            fi
            compose_production() {
              if [ -x "$WALLET_COMPOSE" ]; then "$WALLET_COMPOSE" "$@";
              else docker compose --env-file .env.production -f "$COMPOSE_FILE" "$@"; fi
            }
            compose_production up -d --no-deps --force-recreate app
            compose_production ps
            ready=0
            for attempt in $(seq 1 90); do
              if curl --silent --fail --max-time 3 http://127.0.0.1:5005/baseurl/api/v1/testapi -o /dev/null; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1
            docker exec express_pos_app_production node -e 'const assert=require("node:assert/strict");const mysql=require("mysql2/promise");(async()=>{const c=await mysql.createConnection(process.env.DATABASE_URL);const [v]=await c.query("SELECT version FROM schema_migrations WHERE version IN (?,?)",["20261106120000","20261109120000"]);assert.equal(v.length,2);const [cols]=await c.query("SELECT column_name FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name IN (?,?) AND column_name=?",["orders","archives","customer_profile_id"]);assert.equal(cols.length,2);assert.equal(require("./src/helpers/terminalCardWait").CARD_WAIT_TIMEOUT_MS,60000);const [[u]]=await c.query("SELECT id,shopid FROM users WHERE access=0 AND status=1 ORDER BY id LIMIT 1");if(u){const token=require("jsonwebtoken").sign({id:u.id,shopid:u.shopid,subject_type:"staff"},require("./src/helpers/env").envJWTKEY,{expiresIn:"60s"});const headers={Authorization:"Bearer "+token};const r=await fetch("http://127.0.0.1:5005/baseurl/api/v1/clients?pageSize=1",{headers});assert.equal(r.status,200);const invalid=await fetch("http://127.0.0.1:5005/baseurl/api/v1/clients/resolve-phone",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({phone:"invalid"})});assert.equal(invalid.status,422);}await c.end();console.log("Production schema, directory, phone validation and 60-second Terminal wait verified.")})().catch(e=>{console.error("Production readiness:",e.code||e.message);process.exitCode=1})'
            echo "PRODUCTION_BACKEND_COMMIT=$(git rev-parse HEAD)"

  deploy-pm2:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pm2' && inputs.operation != 'preflight' }}
    runs-on: smarteat-runner-backend

    steps:
      - name: Deploy on server with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.1.140
          username: smarteatprod
          password: root
          port: 22
          script_stop: true
          script: |
            set -e

            APP_DIR=/home/smarteatprod/smarteat/backend
            APP_NAME=backend_smart_eat_production
            BRANCH=master
            REPO_URL=https://github.com/SuperJumper404/express-pos.git

            rm -rf "$APP_DIR"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"

            cd "$APP_DIR"

            npm install

            export DOTENV_PRIVATE_KEY='${{ secrets.DOTENV_PRIVATE_KEY }}'
            test -n "$DOTENV_PRIVATE_KEY"
            ./node_modules/.bin/dotenvx decrypt -f .env.production
            ! grep -q "encrypted:" .env.production

            set -a
            . ./.env.production
            set +a

            npm run db:up:production

            pm2 delete "$APP_NAME" || true
            pm2 start ecosystem.config.js --env production --name "$APP_NAME"
            pm2 save
