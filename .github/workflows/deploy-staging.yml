name: Deploy Backend to Staging

on:
  # push:
  #   branches:
  #     - staging

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode de déploiement"
        required: true
        type: choice
        options:
          - compose
          - pm2

jobs:
  deploy-compose:
    if: ${{ github.event_name == 'push' || inputs.mode == 'compose' }}
    runs-on: smarteat-runner-backend

    steps:
      - name: Deploy on server with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.1.99
          username: vscodeserver
          password: roottoorroot
          port: 22
          script_stop: false
          script: |
            set -e

            APP_DIR=/home/vscodeserver/smarteat/backend
            BRANCH=staging
            REPO_URL=https://github.com/SuperJumper404/express-pos.git
            COMPOSE_FILE=compose.yml

            umask 077
            BACKUP_DIR=/home/vscodeserver/smarteat-backups/backend-$(date -u +%Y%m%d-%H%M%S)-$$
            mkdir -p "$BACKUP_DIR"
            test "$APP_DIR" = /home/vscodeserver/smarteat/backend
            if [ -d "$APP_DIR" ]; then
              git -C "$APP_DIR" rev-parse HEAD > "$BACKUP_DIR/previous.sha"
              if [ -f "$APP_DIR/.env.staging" ]; then cp "$APP_DIR/.env.staging" "$BACKUP_DIR/runtime.env.staging"; fi
              tar -czf "$BACKUP_DIR/source.tar.gz" --exclude=node_modules --exclude=.git -C "$APP_DIR" .
            fi
            docker inspect express_pos_db_staging >/dev/null
            DATABASE_NAME=$(docker exec express_pos_app_staging node -p 'new URL(process.env.DATABASE_URL).pathname.slice(1)')
            test -n "$DATABASE_NAME"
            docker exec express_pos_app_staging node -e 'const u=new URL(process.env.DATABASE_URL);const q=value=>JSON.stringify(decodeURIComponent(value));process.stdout.write("[client]\nuser="+q(u.username)+"\npassword="+q(u.password)+"\nhost="+JSON.stringify(u.hostname)+"\nport="+(u.port||3306)+"\n")' > "$BACKUP_DIR/database-client.cnf"
            test -s "$BACKUP_DIR/database-client.cnf"
            docker run --rm --network container:express_pos_app_staging -v "$BACKUP_DIR/database-client.cnf:/run/database-client.cnf:ro" mysql:8.0.33 mysqldump --defaults-extra-file=/run/database-client.cnf --single-transaction --routines --triggers --databases "$DATABASE_NAME" > "$BACKUP_DIR/database.sql"
            rm -f "$BACKUP_DIR/database-client.cnf"
            test -s "$BACKUP_DIR/database.sql"
            gzip "$BACKUP_DIR/database.sql"
            echo "STAGING_BACKUP_PATH=$BACKUP_DIR"

            rm -rf "$APP_DIR"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"

            cd "$APP_DIR"

            export DOTENV_PRIVATE_KEY='${{ secrets.DOTENV_PRIVATE_KEY }}'
            test -n "$DOTENV_PRIVATE_KEY"
            docker run --rm \
              -v "$PWD:/app" \
              -w /app \
              -e DOTENV_PRIVATE_KEY \
              node:20-alpine \
              npx --yes @dotenvx/dotenvx decrypt -f .env.staging
            ! grep -q "encrypted:" .env.staging
            if [ -s "$BACKUP_DIR/runtime.env.staging" ]; then
              cp "$BACKUP_DIR/runtime.env.staging" .env.staging
              ! grep -q "encrypted:" .env.staging
            fi

            WALLET_COMPOSE=/home/vscodeserver/.smarteat/apple-wallet/staging/compose-wallet.sh
            compose_staging() {
              if [ -x "$WALLET_COMPOSE" ]; then
                "$WALLET_COMPOSE" "$@"
              else
                docker compose --env-file .env.staging -f "$COMPOSE_FILE" "$@"
              fi
            }

            compose_staging up -d --no-deps --force-recreate app
            compose_staging ps
            ready=0
            for attempt in $(seq 1 90); do
              if curl --silent --fail --max-time 3 http://127.0.0.1:5005/baseurl/api/v1/testapi -o /dev/null; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1
            docker exec express_pos_app_staging node -e 'const assert=require("node:assert/strict");const mysql=require("mysql2/promise");(async()=>{const c=await mysql.createConnection(process.env.DATABASE_URL);const [v]=await c.query("SELECT version FROM schema_migrations WHERE version IN (?,?)",["20261106120000","20261109120000"]);assert.equal(v.length,2);const [cols]=await c.query("SELECT column_name FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name IN (?,?) AND column_name=?",["orders","archives","customer_profile_id"]);assert.equal(cols.length,2);assert.equal(require("./src/helpers/terminalCardWait").CARD_WAIT_TIMEOUT_MS,60000);const [[u]]=await c.query("SELECT id,shopid FROM users WHERE access=0 AND status=1 ORDER BY id LIMIT 1");if(u){const token=require("jsonwebtoken").sign({id:u.id,shopid:u.shopid,subject_type:"staff"},require("./src/helpers/env").envJWTKEY,{expiresIn:"60s"});const headers={Authorization:"Bearer "+token};const r=await fetch("http://127.0.0.1:5005/baseurl/api/v1/clients?pageSize=1",{headers});assert.equal(r.status,200);const invalid=await fetch("http://127.0.0.1:5005/baseurl/api/v1/clients/resolve-phone",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({phone:"invalid"})});assert.equal(invalid.status,422);}await c.end();console.log("Staging schema, directory, phone validation and 60-second Terminal wait verified.")})().catch(e=>{console.error("Staging readiness:",e.code||e.message);process.exitCode=1})'
            echo "STAGING_BACKEND_COMMIT=$(git rev-parse HEAD)"

  deploy-pm2:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pm2' }}
    runs-on: smarteat-runner-backend

    steps:
      - name: Deploy on server with PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.1.179
          username: webserversmarteat
          password: root
          port: 22
          script_stop: true
          script: |
            set -e

            APP_DIR=/home/webserversmarteat/smarteat/backend
            APP_NAME=backend_smart_eat_staging
            BRANCH=staging
            REPO_URL=https://github.com/SuperJumper404/express-pos.git

            rm -rf "$APP_DIR"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"

            cd "$APP_DIR"

            npm install

            export DOTENV_PRIVATE_KEY='${{ secrets.DOTENV_PRIVATE_KEY }}'
            test -n "$DOTENV_PRIVATE_KEY"
            ./node_modules/.bin/dotenvx decrypt -f .env.staging
            ! grep -q "encrypted:" .env.staging

            set -a
            . ./.env.staging
            set +a

            npm run db:up:staging

            pm2 delete "$APP_NAME" || true
            pm2 start ecosystem.config.js --env staging --name "$APP_NAME"
            pm2 save
